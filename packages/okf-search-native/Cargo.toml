[package]
name = "okf-search-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
test-fixtures = []

[dependencies]
okf-prepare-core = { path = "../../crates/okf-prepare-core" }
chrono = "0.4"
napi = { version = "3.12", default-features = false, features = ["napi8", "chrono_date", "dyn-symbols"] }
napi-derive = "3"
parking_lot = "0.12"
# Cache compatibility metadata deliberately supports this exact index implementation.
tantivy = "=0.26.1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
fs4 = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1

# Rust 1.88's macOS build-script binaries cannot run after symbol stripping.
# Keep the shipped cdylib stripped while leaving build scripts executable.
[profile.release.build-override]
strip = "none"

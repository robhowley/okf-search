name: Package validation

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: package-validation-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-validation:
    name: Build, test, and verify install
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          components: clippy,rustfmt

      - name: Validate packages
        run: pnpm package:check

  native-artifacts:
    name: Native artifact (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
            artifact: okf-search-native.linux-x64-gnu.node
            napi-cross: true
            macos-deployment-target: ''
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
            artifact: okf-search-native.darwin-x64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
            artifact: okf-search-native.darwin-arm64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
            artifact: okf-search-native.win32-x64-msvc.node
            napi-cross: false
            macos-deployment-target: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
          components: clippy,rustfmt

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=${{ matrix.node-arch }}

      - name: Build native package
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        run: pnpm --dir packages/okf-search-native run build --target "${{ matrix.target }}" --use-napi-cross=${{ matrix.napi-cross }}

      - name: Verify Linux glibc floor
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm --dir packages/okf-search-native run verify:release-artifacts glibc "${{ matrix.artifact }}"

      - name: Full native package tests
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}
        run: pnpm --dir packages/okf-search-native run test

      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-search-native-${{ matrix.target }}
          path: packages/okf-search-native/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

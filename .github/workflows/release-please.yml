name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact non-draft release tag; unpublished recovery requires dispatch from main at that tag's commit
        required: true
        type: string

concurrency:
  group: release-please
  cancel-in-progress: false

permissions: {}

jobs:
  release_please:
    name: Create releases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create release
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  release_metadata:
    name: Resolve immutable release metadata
    needs: release_please
    if: >-
      ${{
        always() &&
        (
          needs.release_please.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && needs.release_please.result == 'skipped')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_releases: ${{ steps.candidates.outputs.has_releases }}
      release_commit: ${{ steps.candidates.outputs.release_commit }}
      released_packages: ${{ steps.candidates.outputs.released_packages }}
      native_released: ${{ steps.candidates.outputs.native_released }}
      pi_released: ${{ steps.candidates.outputs.pi_released }}
    steps:
      - name: Checkout publication automation and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact release candidates
        id: candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          metadata="$(node scripts/release-candidates.mjs)"
          packages="$(jq -ce '.packages' <<<"$metadata")"
          echo "release_commit=$(jq -er '.commit' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "released_packages=$packages" >>"$GITHUB_OUTPUT"
          echo "has_releases=$(jq -r '.packages | length > 0' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "native_released=$(jq -r '.packages | any(.path == "packages/okf-search-native")' <<<"$metadata")" >>"$GITHUB_OUTPUT"
          echo "pi_released=$(jq -r '.packages | any(.path == "packages/pi-okf-search")' <<<"$metadata")" >>"$GITHUB_OUTPUT"

  native_release_build:
    name: Release native artifact (${{ matrix.target }})
    needs: release_metadata
    if: needs.release_metadata.outputs.native_released == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
            artifact: okf-search-native.linux-x64-gnu.node
            napi-cross: true
            macos-deployment-target: ''
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
            artifact: okf-search-native.darwin-x64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
            artifact: okf-search-native.darwin-arm64.node
            napi-cross: false
            macos-deployment-target: '10.13'
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
            artifact: okf-search-native.win32-x64-msvc.node
            napi-cross: false
            macos-deployment-target: ''
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          targets: ${{ matrix.target }}
      - name: Install dependencies for target CPU
        run: pnpm install --frozen-lockfile --cpu=${{ matrix.node-arch }}
      - name: Build native package
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos-deployment-target }}
        run: pnpm --dir packages/okf-search-native run build --target "${{ matrix.target }}" --use-napi-cross=${{ matrix.napi-cross }}
      - name: Verify Linux glibc floor
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm --dir packages/okf-search-native run verify:release-artifacts glibc "${{ matrix.artifact }}"
      - name: Runtime package API test
        run: pnpm --dir packages/okf-search-native run test:package-api
      - name: Verify exact nonempty artifact
        shell: bash
        run: test -s "packages/okf-search-native/${{ matrix.artifact }}"
      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: okf-search-native-${{ matrix.target }}
          path: packages/okf-search-native/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  candidate_plan:
    name: Build, pack, and test one immutable publication plan
    needs: [release_metadata, native_release_build]
    if: >-
      ${{
        always() && needs.release_metadata.result == 'success' &&
        needs.release_metadata.outputs.has_releases == 'true' &&
        (
          (needs.release_metadata.outputs.native_released == 'false' && needs.native_release_build.result == 'skipped') ||
          (needs.release_metadata.outputs.native_released == 'true' && needs.native_release_build.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install immutable source dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust for the Pi native backend
        if: needs.release_metadata.outputs.pi_released == 'true' && needs.release_metadata.outputs.native_released == 'false'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
      - name: Build the Pi native backend
        if: needs.release_metadata.outputs.pi_released == 'true' && needs.release_metadata.outputs.native_released == 'false'
        run: pnpm --dir packages/okf-search-native run build
      - name: Remove stale native output
        if: needs.release_metadata.outputs.native_released == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find packages/okf-search-native -maxdepth 1 -type f -name '*.node' -delete
          rm -rf packages/okf-search-native/npm "$RUNNER_TEMP/okf-native-artifacts"
      - name: Download only current-run tested native artifacts
        if: needs.release_metadata.outputs.native_released == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: okf-search-native-*
          path: ${{ runner.temp }}/okf-native-artifacts
          merge-multiple: true
      - name: Assemble and verify exact native files
        if: needs.release_metadata.outputs.native_released == 'true'
        working-directory: packages/okf-search-native
        shell: bash
        run: |
          set -euo pipefail
          pnpm run build:facade
          rm -rf npm
          pnpm exec napi create-npm-dirs --npm-dir npm
          pnpm exec napi artifacts --output-dir "$RUNNER_TEMP/okf-native-artifacts" --npm-dir npm
          node scripts/verify-release-artifacts.mjs
      - name: Build and test selected JavaScript packages
        env:
          RELEASED_PACKAGES_JSON: ${{ needs.release_metadata.outputs.released_packages }}
        shell: bash
        run: |
          set -euo pipefail
          if jq -e 'any(.path == "packages/okf-minisearch")' <<<"$RELEASED_PACKAGES_JSON" >/dev/null; then
            pnpm --filter okf-minisearch build
            pnpm --filter okf-minisearch test
          fi
          if jq -e 'any(.path == "packages/pi-okf-search")' <<<"$RELEASED_PACKAGES_JSON" >/dev/null; then
            pnpm --filter pi-okf-search typecheck
            pnpm --filter pi-okf-search test
          fi
      - name: Pack every selected package once and create the immutable plan
        env:
          RELEASED_PACKAGES_JSON: ${{ needs.release_metadata.outputs.released_packages }}
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/publication-plan"
          selection="$RUNNER_TEMP/selection.json"
          mkdir -p "$destination"
          jq -cn --arg commit "$RELEASE_COMMIT" --argjson packages "$RELEASED_PACKAGES_JSON" \
            '{commit: $commit, packages: $packages}' >"$selection"

          while IFS= read -r package; do
            package_path="$(jq -er '.path' <<<"$package")"
            name="$(jq -er '.name' <<<"$package")"
            version="$(jq -er '.version' <<<"$package")"
            jq -e --arg name "$name" --arg version "$version" \
              '.name == $name and .version == $version' "$package_path/package.json" >/dev/null
            pack_json="$(cd "$package_path" && pnpm pack --pack-destination "$destination" --json)"
            source_tarball="$(jq -er '.filename' <<<"$pack_json")"
            if [[ "$source_tarball" != /* ]]; then source_tarball="$GITHUB_WORKSPACE/$package_path/$source_tarball"; fi
            target_tarball="$destination/$name-$version.tgz"
            if [[ "$source_tarball" != "$target_tarball" ]]; then mv "$source_tarball" "$target_tarball"; fi
            test -s "$target_tarball"
          done < <(jq -c '.[]' <<<"$RELEASED_PACKAGES_JSON")

          node scripts/release-publication.mjs create "$destination" "$selection" "$RELEASE_COMMIT" "$destination/plan.json"
          node scripts/verify-release-consumer.mjs local-js "$destination" "$destination/plan.json" "$RELEASE_COMMIT"
      - name: Upload immutable plan and its exact tarballs
        uses: actions/upload-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
          if-no-files-found: error
          retention-days: 7

  native_candidate_test:
    name: Candidate consumer (${{ matrix.target }})
    needs: [release_metadata, candidate_plan]
    if: needs.release_metadata.outputs.native_released == 'true' && needs.candidate_plan.result == 'success'
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.allow-failure }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            node-arch: x64
            allow-failure: false
          - runner: macos-latest
            target: x86_64-apple-darwin
            node-arch: x64
            allow-failure: false
          - runner: macos-latest
            target: aarch64-apple-darwin
            node-arch: arm64
            allow-failure: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: x64
            allow-failure: true
    steps:
      - name: Checkout immutable consumer proof
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
          standalone: true
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          architecture: ${{ matrix.node-arch }}
          cache: pnpm
      - name: Install proof dependencies without scripts for target CPU
        run: pnpm install --frozen-lockfile --ignore-scripts --cpu=${{ matrix.node-arch }}
      - name: Download one immutable publication plan
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Verify the whole plan and test the native tarball
        env:
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          node scripts/verify-release-consumer.mjs local-native \
            "$RUNNER_TEMP/publication-plan" "$RUNNER_TEMP/publication-plan/plan.json" "$RELEASE_COMMIT" \
            --typescript "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc"

  publication_transaction:
    name: Publish packages to npm
    needs: [release_metadata, candidate_plan, native_candidate_test]
    if: >-
      ${{
        always() && needs.release_metadata.result == 'success' && needs.candidate_plan.result == 'success' &&
        (
          (needs.release_metadata.outputs.native_released == 'false' && needs.native_candidate_test.result == 'skipped') ||
          (needs.release_metadata.outputs.native_released == 'true' && needs.native_candidate_test.result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    environment: npm-production
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout immutable publication transaction
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release_metadata.outputs.release_commit }}
          persist-credentials: false
      - name: Download immutable publication plan
        uses: actions/download-artifact@v4
        with:
          name: release-publication-plan
          path: ${{ runner.temp }}/publication-plan
      - name: Setup Node.js for trusted publishing
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          registry-url: https://registry.npmjs.org
      - name: Install npm 11
        run: npm install --global npm@11
      - name: Validate the plan and publish missing tarballs only
        env:
          RELEASED_PACKAGES_JSON: ${{ needs.release_metadata.outputs.released_packages }}
          RELEASE_COMMIT: ${{ needs.release_metadata.outputs.release_commit }}
        shell: bash
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/selection.json"
          jq -cn --arg commit "$RELEASE_COMMIT" --argjson packages "$RELEASED_PACKAGES_JSON" \
            '{commit: $commit, packages: $packages}' >"$selection"
          node scripts/release-publication.mjs transact \
            "$RUNNER_TEMP/publication-plan" "$RUNNER_TEMP/publication-plan/plan.json" "$selection"
